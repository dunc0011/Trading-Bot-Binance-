
services:
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot-web-ui
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
      - "6006:6006"  # TensorBoard
    volumes:
      # Mount logs for persistence
      - ./logs:/app/logs
      # Mount data for database persistence
      - ./data:/app/data
      # Mount models for ML persistence
      - ./models:/app/models
      # Mount source code for development
      - ./src:/app/src
      - ./config:/app/config
      - ./web:/app/web
      - ./scripts:/app/scripts
      - ./start.sh:/app/start.sh
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key-change-in-production}
    command: sh -c "python -m tensorboard.main --logdir logs/rl_tensorboard --bind_all --port 6006 & python src/web_app.py"
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trading-network:
    driver: bridge
