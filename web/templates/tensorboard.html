<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TensorBoard - RL Training Visualization</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .frame-wrap { height: calc(100vh - 80px); border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">TensorBoard - RL Training</h1>
      <a href="/" class="btn btn-secondary">Back to Dashboard</a>
    </div>
    <div class="alert alert-info">
      If the panel below is empty, start TensorBoard first:
      <code>docker-compose exec web-ui tensorboard --logdir logs/rl_tensorboard --bind_all --port 6006</code>
    </div>
    <div class="frame-wrap">
      <iframe src="http://localhost:6006/" width="100%" height="100%" frameborder="0"></iframe>
    </div>
  </div>
</body>
</html>
