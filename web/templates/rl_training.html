<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Agent Training - Trading Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .card-body {
            padding: 2rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
        }
        
        .progress {
            height: 30px;
            border-radius: 10px;
            background: #e9ecef;
        }
        
        .progress-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-weight: 600;
            font-size: 14px;
        }
        
        .model-card {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
            background: white;
        }
        
        .model-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
        }
        
        .badge-algo {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .alert-training {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border: none;
            border-radius: 10px;
            padding: 1.5rem;
            color: #333;
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
        
        .nav-link {
            color: white !important;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4" style="background: rgba(0, 0, 0, 0.3);">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-robot"></i> Trading Bot
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a class="nav-link active" href="/rl">
                    <i class="bi bi-brain"></i> RL Training
                </a>
                <a class="nav-link" href="http://localhost:6006" target="_blank">
                    <i class="bi bi-graph-up"></i> TensorBoard
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Training Form -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-play-circle-fill"></i> Train New RL Agent
            </div>
            <div class="card-body">
                <form id="trainingForm">
                    <div class="row">
                        <div class="col-md-3">
                            <label class="form-label">Symbol</label>
                            <input type="text" class="form-control" id="symbol" value="BTCUSDT" placeholder="e.g., BTCUSDT">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Timeframe</label>
                            <select class="form-select" id="timeframe">
                                <option value="1m">1 minute</option>
                                <option value="5m" selected>5 minutes</option>
                                <option value="15m">15 minutes</option>
                                <option value="1h">1 hour</option>
                                <option value="4h">4 hours</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Algorithm</label>
                            <select class="form-select" id="algorithm">
                                <option value="PPO" selected>PPO</option>
                                <option value="A2C">A2C</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Lookback Days</label>
                            <input type="number" class="form-control" id="lookback_days" value="180" min="30" max="365">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Training Steps</label>
                            <input type="number" class="form-control" id="total_timesteps" value="100000" step="10000">
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary" id="startTrainingBtn">
                            <i class="bi bi-play-fill"></i> Start Training
                        </button>
                        <button type="button" class="btn btn-success ms-2" id="autoTrainBtn" onclick="startAutoTraining()">
                            <i class="bi bi-stars"></i> Auto-Train Top 10 Pairs
                        </button>
                        <small class="text-muted ms-3">
                            <i class="bi bi-info-circle"></i> Training will run in the background. You can monitor progress below.
                        </small>
                    </div>
                </form>
            </div>
        </div>

        <!-- Training Progress -->
        <div class="card" id="trainingProgressCard" style="display: none;">
            <div class="card-header">
                <i class="bi bi-hourglass-split"></i> Training in Progress
            </div>
            <div class="card-body">
                <div class="alert alert-training" role="alert">
                    <div class="d-flex align-items-center">
                        <div class="spinner-border spinner-border-sm me-3" role="status"></div>
                        <strong id="trainingStatus">Initializing training...</strong>
                    </div>
                </div>
                <div class="progress mt-3">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" 
                         id="trainingProgressBar" style="width: 0%">0%</div>
                </div>
                <p class="text-muted mt-2 mb-0" id="trainingDetails">Preparing data and environment...</p>
            </div>
        </div>

        <!-- Training Results -->
        <div class="card" id="trainingResultsCard" style="display: none;">
            <div class="card-header">
                <i class="bi bi-check-circle-fill"></i> Training Complete
            </div>
            <div class="card-body">
                <div class="row" id="trainingStats">
                    <!-- Stats will be populated here -->
                </div>
            </div>
        </div>

        <!-- Trained Models -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-collection"></i> Trained RL Models</span>
                <button class="btn btn-sm btn-light" onclick="loadModels()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body">
                <div id="modelsList">
                    <div class="text-center text-muted py-4">
                        <div class="spinner-border" role="status"></div>
                        <p class="mt-2">Loading models...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Connect to SocketIO
        const socket = io();

        // Load models on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadModels();
        });

        // Training form submission
        document.getElementById('trainingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                symbol: document.getElementById('symbol').value,
                timeframe: document.getElementById('timeframe').value,
                algorithm: document.getElementById('algorithm').value,
                lookback_days: parseInt(document.getElementById('lookback_days').value),
                total_timesteps: parseInt(document.getElementById('total_timesteps').value)
            };

            try {
                const response = await fetch('/api/rl/train', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    // Show progress card
                    document.getElementById('trainingProgressCard').style.display = 'block';
                    document.getElementById('trainingResultsCard').style.display = 'none';
                    document.getElementById('trainingStatus').textContent = result.message;
                    document.getElementById('startTrainingBtn').disabled = true;
                } else {
                    alert('Training failed: ' + result.message);
                }
            } catch (error) {
                alert('Error starting training: ' + error.message);
            }
        });

        // Listen for training progress
        socket.on('rl_training_progress', (data) => {
            console.log('Training progress:', data);
            document.getElementById('trainingStatus').textContent = data.message || data.status;
        });

        // Listen for auto-training started
        socket.on('rl_auto_training_started', (data) => {
            console.log('Auto-training started:', data);
            document.getElementById('trainingProgressCard').style.display = 'block';
            document.getElementById('trainingResultsCard').style.display = 'none';
            document.getElementById('trainingStatus').textContent = data.message;
            document.getElementById('autoTrainBtn').disabled = true;
            document.getElementById('startTrainingBtn').disabled = true;
        });

        // Listen for auto-training completion
        socket.on('rl_auto_training_complete', (data) => {
            console.log('Auto-training complete:', data);
            document.getElementById('trainingProgressCard').style.display = 'none';
            document.getElementById('autoTrainBtn').disabled = false;
            document.getElementById('startTrainingBtn').disabled = false;
            
            if (data.success) {
                alert(data.message);
                setTimeout(loadModels, 1000);
            } else {
                alert('Auto-training failed: ' + data.error);
            }
        });

        // Listen for training completion
        socket.on('rl_training_complete', (data) => {
            console.log('Training complete:', data);

            document.getElementById('trainingProgressCard').style.display = 'none';
            document.getElementById('startTrainingBtn').disabled = false;

            if (data.success) {
                // Show results
                document.getElementById('trainingResultsCard').style.display = 'block';

                const stats = data.stats;
                const statsHtml = `
                    <div class="col-md-3">
                        <div class="stat-box">
                            <div class="stat-value">${stats.avg_return_pct.toFixed(2)}%</div>
                            <div class="stat-label">Avg Return</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-box">
                            <div class="stat-value">${stats.avg_sharpe_ratio.toFixed(2)}</div>
                            <div class="stat-label">Sharpe Ratio</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-box">
                            <div class="stat-value">${(stats.avg_win_rate * 100).toFixed(1)}%</div>
                            <div class="stat-label">Win Rate</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-box">
                            <div class="stat-value">${stats.avg_trades_per_episode.toFixed(1)}</div>
                            <div class="stat-label">Avg Trades</div>
                        </div>
                    </div>
                `;
                document.getElementById('trainingStats').innerHTML = statsHtml;

                // Reload models list
                setTimeout(loadModels, 1000);
            } else {
                alert('Training failed: ' + data.error);
            }
        });

        // Load models
        async function loadModels() {
            try {
                const response = await fetch('/api/rl/models');
                const result = await response.json();

                if (result.success && result.models.length > 0) {
                    const modelsHtml = result.models.map(model => `
                        <div class="model-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h5 class="mb-2">
                                        <i class="bi bi-robot"></i> ${model.symbol} ${model.timeframe}
                                    </h5>
                                    <span class="badge-algo">${model.algorithm}</span>
                                    <p class="text-muted mt-2 mb-1">
                                        <small>Trained: ${new Date(model.trained_at).toLocaleString()}</small>
                                    </p>
                                    <p class="text-muted mb-0">
                                        <small>${model.total_timesteps.toLocaleString()} steps • ${model.data_samples.toLocaleString()} samples</small>
                                    </p>
                                </div>
                                <div class="text-end">
                                    ${model.evaluation ? `
                                        <div class="mb-2">
                                            <strong class="d-block">Return: ${model.evaluation.avg_return_pct.toFixed(2)}%</strong>
                                            <small class="text-muted">Sharpe: ${model.evaluation.avg_sharpe_ratio.toFixed(2)}</small>
                                        </div>
                                    ` : ''}
                                    <button class="btn btn-sm btn-secondary" onclick="evaluateModel('${model.symbol}', '${model.timeframe}')">
                                        <i class="bi bi-bar-chart"></i> Evaluate
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    document.getElementById('modelsList').innerHTML = modelsHtml;
                } else {
                    document.getElementById('modelsList').innerHTML = `
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                            <p class="mt-2">No trained models yet. Train your first RL agent above!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading models:', error);
                document.getElementById('modelsList').innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load models: ${error.message}
                    </div>
                `;
            }
        }

        // Start auto-training for top pairs
        async function startAutoTraining() {
            const maxPairs = 10;
            const timeframe = document.getElementById('timeframe').value;
            const lookback = parseInt(document.getElementById('lookback_days').value);
            const steps = parseInt(document.getElementById('total_timesteps').value);
            
            if (!confirm(`Auto-train RL agents for top ${maxPairs} trading pairs? This will take some time.`)) {
                return;
            }
            
            try {
                const response = await fetch('/api/rl/auto_train', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        max_pairs: maxPairs,
                        timeframe: timeframe,
                        lookback_days: lookback,
                        total_timesteps: steps
                    })
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    alert('Failed to start auto-training: ' + result.message);
                }
            } catch (error) {
                alert('Error starting auto-training: ' + error.message);
            }
        }

        // Evaluate model
        async function evaluateModel(symbol, timeframe) {
            if (!confirm(`Evaluate ${symbol} ${timeframe} model on last 30 days?`)) {
                return;
            }

            try {
                const response = await fetch('/api/rl/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol, timeframe, n_episodes: 10 })
                });

                const result = await response.json();

                if (result.success) {
                    const stats = result.stats;
                    alert(
                        `Evaluation Results (${symbol} ${timeframe}):\n\n` +
                        `Avg Return: ${stats.avg_return_pct.toFixed(2)}%\n` +
                        `Sharpe Ratio: ${stats.avg_sharpe_ratio.toFixed(2)}\n` +
                        `Win Rate: ${(stats.avg_win_rate * 100).toFixed(1)}%\n` +
                        `Avg Trades: ${stats.avg_trades_per_episode.toFixed(1)}\n` +
                        `Max Drawdown: ${stats.avg_max_drawdown.toFixed(2)}%`
                    );
                } else {
                    alert('Evaluation failed: ' + result.message);
                }
            } catch (error) {
                alert('Error evaluating model: ' + error.message);
            }
        }
    </script>
</body>
</html>
